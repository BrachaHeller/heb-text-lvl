[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hebrew-readability"
version = "0.1.0"
description = "Continuous Hebrew Readability Assessment and Explainable Linguistic Feature Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "huggingface_hub>=0.20.0",
    "stanza>=1.7.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "onnxruntime>=1.16.0",
    "dicta-onnx>=0.1.0",
    "spacy>=3.7.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0"
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
train = [
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "datasets>=2.16.0",
]
app = [
    "gradio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]